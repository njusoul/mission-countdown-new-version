<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Countdown · Nov 24, 15:59 SGT</title>
  <style>
    :root {
      --bg: #121518;
      --surface: #1a1f24;
      --border: #2a3139;
      --text: #f3f5f7;
      --muted: #9aa4b0;
      --accent: #e59a3c;
      --dock-bg: rgba(42, 48, 56, 0.72);
      --tile-bg: rgba(24, 28, 34, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1b2127 0%, var(--bg) 72%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      padding: 24px 24px 96px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 40px 28px 34px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .eyebrow {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .timer {
      font-size: clamp(2.8rem, 10vw, 4.2rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
      margin-bottom: 6px;
    }

    .sub-label {
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .deadline {
      font-size: 0.85rem;
      color: var(--text);
      opacity: 0.9;
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
      margin: 0 auto 24px;
      width: 80%;
    }

    .phase-box {
      margin-bottom: 28px;
    }

    .phase-label {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .phase-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      padding: 11px 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .phase-input:focus {
      border-color: var(--accent);
    }

    /* Waveform Display (Image 2 Style) */
    .waveform-wrap {
      padding: 8px 0 6px;
      cursor: pointer;
      user-select: none;
    }

    .waveform {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .bar {
      width: 3.2px;
      height: var(--h, 6px);
      background: #e6eaef;
      border-radius: 999px;
      opacity: 0.85;
      transition: height 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .waveform.playing .bar {
      animation: pulseBar 1.1s ease-in-out infinite alternate;
      animation-delay: calc(var(--i) * -0.07s);
      opacity: 1;
    }

    .waveform.playing .bar.active-accent {
      background: var(--accent);
    }

    @keyframes pulseBar {
      0% {
        transform: scaleY(0.45);
      }
      100% {
        transform: scaleY(1.15);
      }
    }

    .track-caption {
      margin-top: 10px;
      font-size: 0.74rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Compact Floating Dock (Image 3 Style) */
    .dock {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--dock-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
    }

    .dock-sep {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.14);
      margin: 0 2px;
    }

    .dock-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--tile-bg);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .dock-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.28);
      background: #252b33;
    }

    .dock-btn:active {
      transform: scale(0.95);
    }

    .dock-btn.is-active {
      border-color: var(--accent);
      color: var(--accent);
    }

    .dock-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Tooltip on hover */
    .dock-btn::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #111418;
      color: var(--text);
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 7px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .dock-btn:hover::after {
      opacity: 1;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Countdown to Deadline</div>
    <div class="timer" id="timer">--:--:--</div>
    <div class="sub-label" id="statusLabel">Remaining</div>
    <div class="deadline">NOV 24 · 15:59 SGT &nbsp;(NOV 23 · 23:59 PT)</div>

    <div class="divider"></div>

    <div class="phase-box">
      <div class="phase-label">Current Focus Phase (Click to Edit)</div>
      <input
        class="phase-input"
        type="text"
        value="PHASE: MISSION EXECUTION"
        aria-label="Current Focus Phase"
      />
    </div>

    <!-- Clean Waveform Visual (Click waveform or dock button to play/pause) -->
    <div class="waveform-wrap" id="waveWrap" title="Click to Play / Pause">
      <div class="waveform" id="waveform"></div>
      <div class="track-caption" id="trackName">A Countdown Blue · Click music icon below to load</div>
    </div>
  </main>

  <!-- Compact Floating Mini-Dock -->
  <nav class="dock" aria-label="Countdown Controls">
    <!-- Play / Pause -->
    <button class="dock-btn" id="playBtn" type="button" data-tip="Play / Pause">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <!-- Upload Music -->
    <label class="dock-btn" for="audioFile" data-tip="Upload Music (.mp3 / .mp4)">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </label>
    <input id="audioFile" type="file" accept="audio/*,video/mp4" />

    <!-- Loop Toggle -->
    <button class="dock-btn is-active" id="loopBtn" type="button" data-tip="Loop: ON">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>

    <div class="dock-sep"></div>

    <!-- Fullscreen Toggle -->
    <button class="dock-btn" id="fsBtn" type="button" data-tip="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </nav>

  <audio id="player" src="mission-track.mp4" loop preload="metadata"></audio>

  <script>
    // Target: November 24, 2026 at 15:59:00 SGT (UTC+8) = November 23, 2026 at 23:59:00 PST (UTC-8)
    const DEADLINE_MS = Date.parse("2026-11-24T15:59:00+08:00");

    const timerEl = document.getElementById("timer");
    const statusEl = document.getElementById("statusLabel");
    const waveformEl = document.getElementById("waveform");
    const waveWrap = document.getElementById("waveWrap");
    const player = document.getElementById("player");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const audioFileInput = document.getElementById("audioFile");
    const trackNameEl = document.getElementById("trackName");
    const loopBtn = document.getElementById("loopBtn");
    const fsBtn = document.getElementById("fsBtn");

    // Generate sculpted waveform matching Image 2
    const heights = [
      4, 4, 4, 8, 16, 36, 14, 26, 20, 44, 10, 40, 14, 8, 22, 12,
      4, 4, 48, 22, 12, 26, 14, 6, 4, 4, 4, 4, 4, 4, 4, 4
    ];

    heights.forEach((h, idx) => {
      const bar = document.createElement("span");
      bar.className = "bar" + (h >= 36 ? " active-accent" : "");
      bar.style.setProperty("--h", `${h}px`);
      bar.style.setProperty("--i", idx);
      waveformEl.appendChild(bar);
    });

    function pad(num) {
      return String(num).padStart(2, "0");
    }

    function updateCountdown() {
      const diff = DEADLINE_MS - Date.now();
      if (diff <= 0) {
        timerEl.textContent = "00:00:00";
        statusEl.textContent = "Deadline Reached";
        return;
      }
      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      timerEl.textContent = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    function setPlayingState(isPlaying) {
      if (isPlaying) {
        waveformEl.classList.add("playing");
        playBtn.classList.add("is-active");
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        waveformEl.classList.remove("playing");
        playBtn.classList.remove("is-active");
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    async function togglePlay() {
      if (player.paused) {
        try {
          await player.play();
          setPlayingState(true);
        } catch (err) {
          trackNameEl.textContent = "Click the music note icon below to load your file";
        }
      } else {
        player.pause();
        setPlayingState(false);
      }
    }

    playBtn.addEventListener("click", togglePlay);
    waveWrap.addEventListener("click", togglePlay);

    player.addEventListener("ended", () => {
      if (!player.loop) setPlayingState(false);
    });

    // Upload audio file (.mp3, .mp4, .wav, etc.)
    audioFileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      player.src = URL.createObjectURL(file);
      trackNameEl.textContent = file.name.replace(/\.[^/.]+$/, "");
      player.play().then(() => setPlayingState(true)).catch(() => setPlayingState(false));
    });

    // Loop toggle button
    loopBtn.addEventListener("click", () => {
      player.loop = !player.loop;
      loopBtn.classList.toggle("is-active", player.loop);
      loopBtn.setAttribute("data-tip", player.loop ? "Loop: ON" : "Loop: OFF");
    });

    // Fullscreen toggle button
    fsBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
